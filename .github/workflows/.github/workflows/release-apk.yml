name: Build signed release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Create and sync Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate icons and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor "#5b4bf5" --splashBackgroundColor "#f6f5fb"

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi. Lihat GITHUB_APK.md bagian signing."
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Secret keystore belum lengkap (password, alias, key password)."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          echo "Using build-tools: $BUILD_TOOLS"

          mkdir -p dist
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fintrack-release.jks"

          UNSIGNED="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$UNSIGNED" ]; then
            echo "::error::APK release tidak ditemukan."
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/FinTrack-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/fintrack-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out dist/FinTrack-release.apk \
            "$RUNNER_TEMP/FinTrack-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/FinTrack-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-signed-release-${{ github.run_number }}
          path: dist/FinTrack-release.apk
          if-no-files-found: error
          retention-days: 30
